<!DOCTYPE html>
<html lang="{{language}}" dir="{{direction}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{subject}}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f0f4f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .email-wrapper { width: 100%; background-color: #f0f4f8; padding: 40px 0; }
    .email-container {
      max-width: 580px; margin: 0 auto; background-color: #ffffff;
      border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    .header {
      background: linear-gradient(135deg, #1a2b4a 0%, #243d6b 100%);
      padding: 28px 40px 24px; text-align: center;
    }
    .header-title { color: #ffffff; font-size: 20px; font-weight: 800; margin: 0; line-height: 1.3; }
    .body-content { padding: 32px 40px 28px; }
    .greeting { font-size: 16px; font-weight: 700; color: #1a2b4a; margin: 0 0 16px; }
    .body-text { font-size: 14px; color: #374151; line-height: 1.7; margin: 0 0 16px; }
    .body-text a { color: #1a2b4a; }
    .footer {
      background-color: #f9fafb; padding: 20px 40px; text-align: center;
      border-top: 1px solid #e5e7eb;
    }
    .footer p { font-size: 11px; color: #9ca3af; line-height: 1.6; margin: 0; }
    @media only screen and (max-width: 600px) {
      .email-wrapper { padding: 16px 0; }
      .header { padding: 22px 24px 20px; }
      .body-content { padding: 24px 24px 20px; }
      .footer { padding: 16px 24px; }
    }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-container">
      <div class="header">
        <h1 class="header-title">🧭 {{subject}}</h1>
      </div>
      <div class="body-content">
        <p class="greeting">{{to_name}},</p>
        <div class="body-text">{{body_html}}</div>
      </div>
      <div class="footer">
        <p>
          Change Navigator · <a href="mailto:{{to_email}}">{{to_email}}</a><br/>
          &copy; 2026 Adi Ben-Nesher. All rights reserved.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
